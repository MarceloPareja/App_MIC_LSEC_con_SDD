[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-pipeline"
version = "0.1.0"
description = "Pipeline de video con blur gaussiano (TensorFlow), MediaPipe y esqueleto configurable por JSON."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Proyecto LSEC" }]
dependencies = [
    "numpy>=1.26,<3.0",
    "opencv-contrib-python>=4.9,<5.0",
    "pydantic>=2.6,<3.0",
    "tensorflow>=2.16,<3.0",
    "mediapipe>=0.10.14,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
vision-pipeline = "vision_pipeline.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
